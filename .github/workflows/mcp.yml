name: MCP service validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: .venv-mcp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install locked MCP dependencies
        run: uv sync --locked
      - name: Install semantic verification tools in a separate environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-demo.txt
      - name: Semantic sources and checked-in target agree
        run: .venv/bin/python hr-demo/validation/v2/check_semantics.py --build-check
      - name: Build private read-only data bundle
        run: uv run --no-sync python scripts/prepare_mcp.py
      - name: Authentication, protocol and query tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Official client against the actual local HTTP server
        run: uv run --no-sync python scripts/smoke_mcp.py
      - name: Check deployment dependency and data size
        run: |
          uv run --no-sync python - <<'PY'
          import sysconfig
          from pathlib import Path
          paths = [Path(sysconfig.get_paths()['purelib']), Path('hr_mcp'), Path('hr_query')]
          size = sum(p.stat().st_size for root in paths for p in root.rglob('*') if p.is_file())
          print(f'Installed dependencies and private service bundle: {size:,} bytes')
          assert size < 450_000_000, 'Keep room below Vercel Python 500MB limit'
          PY
