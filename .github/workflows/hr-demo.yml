name: HR verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python scripts/verify.py docs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install both locked environments
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-mcp uv sync --locked --group dev
          UV_PROJECT_ENVIRONMENT=.venv uv sync --locked --no-default-groups --group analysis
      - name: Verify packages, semantics, SQL, snapshots and HTTP
        run: python scripts/verify.py analysis data mcp installation --fresh-data
      - name: Upload SQL results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hr-validation
          path: |
            .ci/regression
            .ci/nl-package.zip
          if-no-files-found: ignore
      - name: Upload complete generated dashboard
        uses: actions/upload-artifact@v7
        with:
          name: hr-dashboard
          path: hr-demo/wren-project/apps/hr-overview
          if-no-files-found: error
