name: HR demo validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Profile, cache and reports are confined to this disposable checkout.
      WREN_HOME: ${{ github.workspace }}/.ci/wren
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install pinned demo tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-demo.txt
          .venv/bin/wren --version
      - name: Offline unit and temporary database tests
        run: .venv/bin/python -m unittest discover -s hr-delivery/validation/v2/tests -v
      - name: Semantic sources and checked-in target agree
        run: .venv/bin/python hr-delivery/validation/v2/check_semantics.py --build-check
      - name: Build demo database from committed deterministic seeds
        run: .venv/bin/python hr-delivery/db/build_duckdb.py --attendance parquet
      - name: Configure checkout-local profile
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          profile = {"datasource": "duckdb", "properties": {
              "url": str(Path("hr-delivery/db/duckdb").resolve()), "format": "duckdb"}}
          Path(".ci").mkdir(exist_ok=True)
          Path(".ci/profile.json").write_text(json.dumps(profile))
          PY
          .venv/bin/wren profile add hr_demo_duck --from-file .ci/profile.json
      - name: Validate and build semantic project
        working-directory: hr-delivery/wren-project
        run: |
          ../../.venv/bin/wren context validate
          ../../.venv/bin/wren context build
      - name: Fixed SQL regression
        run: .venv/bin/python hr-delivery/validation/v2/run_all.py --output-dir .ci/regression
      - name: Dashboard snapshot and query consistency
        run: .venv/bin/python hr-delivery/scripts/export_dashboard.py --check
      - name: Export answer-free NL question package
        run: .venv/bin/python hr-delivery/validation/v2/eval/nl_eval.py export --output-dir .ci/nl-package
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-demo-validation
          path: |
            .ci/regression
            .ci/nl-package
          if-no-files-found: ignore
