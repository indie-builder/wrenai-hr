name: HR demo validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation checker tests
        run: python -m unittest discover -s scripts/tests -p 'test_check_docs.py' -v
      - name: Current documentation links and command paths
        run: python scripts/check_docs.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Profile, cache and reports are confined to this disposable checkout.
      WREN_HOME: ${{ github.workspace }}/.ci/wren
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install pinned demo tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-demo.txt
          .venv/bin/wren --version
      - name: Offline unit and temporary database tests
        run: .venv/bin/python -m unittest discover -s hr-demo/validation/v2/tests -v
      - name: Skill script regression tests
        run: .venv/bin/python -m unittest discover -s scripts/tests -p 'test_skill_scripts.py' -v
      - name: YAML compiler agrees with isolated Wren build
        run: .venv/bin/python hr-demo/validation/v2/check_semantics.py --build-check
      - name: Build demo database from committed deterministic seeds
        run: .venv/bin/python hr-demo/db/build_duckdb.py
      - name: Configure checkout-local profile
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          profile = {"datasource": "duckdb", "properties": {
              "url": str(Path("hr-demo/db/duckdb").resolve()), "format": "duckdb"}}
          Path(".ci").mkdir(exist_ok=True)
          Path(".ci/profile.json").write_text(json.dumps(profile))
          PY
          .venv/bin/wren profile add hr_demo_duck --from-file .ci/profile.json
      - name: Validate and build semantic project
        working-directory: hr-demo/wren-project
        run: |
          ../../.venv/bin/wren context validate
          ../../.venv/bin/wren context build
      - name: Fixed SQL regression
        run: .venv/bin/python hr-demo/validation/v2/run_all.py --output-dir .ci/regression
      - name: Build dashboard and verify snapshot query consistency
        run: |
          .venv/bin/python hr-demo/scripts/export_dashboard.py
          .venv/bin/python hr-demo/scripts/export_dashboard.py --check
      - name: Export answer-free NL question package
        run: .venv/bin/python hr-demo/validation/v2/eval/nl_eval.py export --output-dir .ci/nl-package
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-demo-validation
          path: |
            .ci/regression
            .ci/nl-package
          if-no-files-found: ignore
      - name: Upload complete generated dashboard
        uses: actions/upload-artifact@v4
        with:
          name: hr-dashboard
          path: hr-demo/wren-project/apps/hr-overview
          if-no-files-found: error
