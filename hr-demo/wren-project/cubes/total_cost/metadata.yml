name: total_cost
base_object: v_workforce_monthly
properties:
  description: "人力总成本 cube: 税前应发加社保企业缴纳, 一人一月一行; 人均月成本=total_cost/person_months, 部门按当前档案归属"
measures:
  - name: total_cost
    expression: SUM(base_pay + overtime_pay + bonus + insurance_company)
    type: DOUBLE
  - name: person_months
    expression: COUNT(*)
    type: BIGINT
  - name: payee_count
    expression: COUNT(*)
    type: BIGINT
  - name: base_total
    expression: SUM(base_pay)
    type: DOUBLE
  - name: overtime_total
    expression: SUM(overtime_pay)
    type: DOUBLE
  - name: bonus_total
    expression: SUM(bonus)
    type: DOUBLE
  - name: insurance_total
    expression: SUM(insurance_company)
    type: DOUBLE
dimensions:
  - name: pay_period
    expression: pay_period
    type: VARCHAR
  - name: dept_name
    expression: dept_name
    type: VARCHAR
  - name: job_level
    expression: job_level
    type: VARCHAR
time_dimensions:
  - name: pay_date
    expression: pay_date
    type: DATE
