name: transfers
table_reference:
  catalog: ""
  schema: public
  table: transfers
primary_key: transfer_id
properties:
  description: "人事调动记录: 跨部门调动"
columns:
  - name: transfer_id
    type: INTEGER
    not_null: true
    properties:
      description: "调动记录ID(主键)"
  - name: emp_id
    type: INTEGER
    properties:
      description: "调动员工ID"
  - name: from_dept_id
    type: INTEGER
    properties:
      description: "原部门ID"
  - name: to_dept_id
    type: INTEGER
    properties:
      description: "新部门ID"
  - name: transfer_date
    type: DATE
    properties:
      description: "调动生效日期"
  - name: reason
    type: VARCHAR
    properties:
      description: "调动原因: 组织调整/个人发展/晋升"
