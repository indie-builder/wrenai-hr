name: headcount_plan
table_reference:
  catalog: ""
  schema: public
  table: headcount_plan
primary_key: plan_id
properties:
  description: "年度部门编制规划: 计划编制人数与人力成本预算"
columns:
  - name: plan_id
    type: INTEGER
    not_null: true
    properties:
      description: "编制计划ID(主键)"
  - name: plan_year
    type: INTEGER
    properties:
      description: "规划年度"
  - name: dept_id
    type: INTEGER
    properties:
      description: "部门ID"
  - name: planned_headcount
    type: INTEGER
    properties:
      description: "计划编制人数(年末)"
  - name: budget_labor_cost
    type: DOUBLE
    properties:
      description: "年度人力成本预算(元, 税前应发口径)"
  - name: approved_at
    type: DATE
    properties:
      description: "预算批准日期(上年11-12月)"
