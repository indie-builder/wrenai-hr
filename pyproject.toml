[project]
name = "wrenai-hr-mcp"
version = "0.1.0"
description = "Authenticated read-only HR analytics over MCP Streamable HTTP"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mcp==2.3.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "duckdb==1.5.6",
  "wren-core-py==0.8.0",
  "sqlglot==30.21.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "hr_mcp.server:app"

[tool.vercel.scripts]
build = "python scripts/prepare_mcp.py"
