[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wrenai-hr"
version = "0.1.0"
description = "Read-only HR analytics, semantic validation and MCP service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "duckdb==1.5.6",
  "wren-core-py==0.8.0",
  "sqlglot==30.21.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
service = ["mcp==2.3.0", "fastapi==0.142.2", "uvicorn==0.54.0"]
analysis = ["wrenai==0.15.0", "pyarrow==25.0.1"]
dev = ["httpx==0.28.1"]

[tool.uv]
default-groups = ["service"]

[tool.hatch.build.targets.wheel]
packages = ["src/hr_contracts", "src/hr_query", "src/hr_mcp", "src/hr_analytics"]

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.scripts]
build = "python -m scripts.prepare_mcp"
